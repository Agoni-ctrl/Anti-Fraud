<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - DeepReal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0071E3',
            secondary: '#0F172A',
            light: '#F5F5F7',
            blue: '#0071E3'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .main-container {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
    }

    .logo-card {
      background: linear-gradient(135deg, #0071E3 0%, #0056b3 100%);
      border-radius: 16px 0 0 16px;
      box-shadow: none;
      padding: 48px 36px;
      position: relative;
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 420px;
    }

    @media (max-width: 768px) {
      .logo-card {
        border-radius: 16px 16px 0 0;
        padding: 36px 30px;
      }
    }

    .logo-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .logo-icon {
      font-size: 96px;
      margin-bottom: 18px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .logo-title {
      font-size: 54px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      margin-bottom: 9px;
    }

    .logo-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1.5px;
    }

    .logo-decoration {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .login-card {
      background: white;
      border-radius: 0 16px 16px 0;
      box-shadow: none;
      flex: 1.5;
      padding: 48px 48px;
      min-width: 480px;
    }

    @media (max-width: 768px) {
      .login-card {
        border-radius: 0 0 16px 16px;
        padding: 36px 36px;
      }
    }

    .input-field {
      border: 2px solid #0071E3;
      border-radius: 8px;
      color: #000000;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #0071E3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
      outline: none;
    }

    .btn-primary {
      background-color: #0071E3;
      color: white;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    .captcha-canvas {
      border: 2px solid #0071E3;
      border-radius: 8px;
      cursor: pointer;
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.3s ease;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen flex items-center justify-center p-4">
  <div id="app">
    <div class="main-container w-full max-w-4xl">
      <!-- Logo卡片 -->
      <div class="logo-card">
        <div class="logo-icon">🛡️</div>
        <h1 class="logo-title">DeepReal</h1>
        <p class="logo-subtitle">智能反诈 · 守护真实</p>
        <div class="logo-decoration"></div>
      </div>

      <!-- 登录卡片 -->
      <div class="login-card">
        <div class="text-center mb-4">
          <h2 class="text-xl font-bold text-black mb-1">用户登录</h2>
          <p class="text-sm text-gray-600">欢迎回来，请登录您的账户</p>
        </div>

        <form @submit.prevent="handleLogin">
          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">账号</label>
            <input v-model="formData.username" type="text" placeholder="请输入账号" class="input-field w-full px-3 py-2"
              required>
          </div>

          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">密码</label>
            <input v-model="formData.password" type="password" placeholder="请输入密码" class="input-field w-full px-3 py-2"
              required>
          </div>

          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">验证码</label>
            <div class="flex gap-3">
              <input v-model="formData.captcha" type="text" placeholder="请输入验证码" class="input-field flex-1 px-3 py-2"
                required>
              <canvas ref="captchaCanvas" @click="generateCaptcha" class="captcha-canvas w-28 h-10" width="112"
                height="40"></canvas>
            </div>
            <p class="text-xs text-gray-500 mt-1">点击图片刷新验证码</p>
          </div>

          <div class="mb-4 flex items-center justify-between">
            <label class="flex items-center">
              <input v-model="formData.rememberMe" type="checkbox" class="mr-2">
              <span class="text-black text-xs">记住我</span>
            </label>
            <a href="#" class="text-xs text-blue-600 hover:underline">忘记密码？</a>
          </div>

          <button type="submit" class="btn-primary w-full py-2.5 text-base font-medium">
            登录
          </button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-sm text-black">
            还没有账号？
            <a href="register.html" class="text-blue-600 hover:underline">立即注册</a>
          </p>
        </div>

        <transition name="fade">
          <div v-if="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-center">
            {{ errorMessage }}
          </div>
        </transition>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue

    createApp({
      data() {
        return {
          formData: {
            username: '',
            password: '',
            captcha: '',
            rememberMe: false
          },
          captchaCode: '',
          errorMessage: ''
        }
      },
      mounted() {
        this.generateCaptcha()
      },
      methods: {
        generateCaptcha() {
          const canvas = this.$refs.captchaCanvas
          const ctx = canvas.getContext('2d')

          // 清空画布
          ctx.fillStyle = '#f0f0f0'
          ctx.fillRect(0, 0, canvas.width, canvas.height)

          // 生成随机验证码
          const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'
          let code = ''
          for (let i = 0; i < 4; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length))
          }
          this.captchaCode = code

          // 绘制验证码
          ctx.font = 'bold 24px Arial'
          ctx.textBaseline = 'middle'

          for (let i = 0; i < code.length; i++) {
            // 随机颜色
            const r = Math.floor(Math.random() * 100)
            const g = Math.floor(Math.random() * 100)
            const b = Math.floor(Math.random() * 150 + 100)
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`

            // 随机旋转和位置
            const angle = (Math.random() - 0.5) * 0.4
            const x = 20 + i * 25
            const y = canvas.height / 2 + (Math.random() - 0.5) * 8

            ctx.save()
            ctx.translate(x, y)
            ctx.rotate(angle)
            ctx.fillText(code[i], 0, 0)
            ctx.restore()
          }

          // 添加干扰线
          for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = `rgba(${Math.random() * 200}, ${Math.random() * 200}, ${Math.random() * 200}, 0.3)`
            ctx.beginPath()
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height)
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height)
            ctx.stroke()
          }

          // 添加干扰点
          for (let i = 0; i < 30; i++) {
            ctx.fillStyle = `rgba(${Math.random() * 200}, ${Math.random() * 200}, ${Math.random() * 200}, 0.5)`
            ctx.beginPath()
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, 2 * Math.PI)
            ctx.fill()
          }
        },
        handleLogin() {
          this.errorMessage = ''

          // 验证码验证
          if (this.formData.captcha.toLowerCase() !== this.captchaCode.toLowerCase()) {
            this.errorMessage = '验证码错误，请重新输入'
            this.generateCaptcha()
            this.formData.captcha = ''
            return
          }

          // 模拟登录验证
          if (this.formData.username && this.formData.password) {
            localStorage.setItem('isLogin', 'true')
            localStorage.setItem('username', this.formData.username)

            // 跳转到身份定制页面
            window.location.href = 'identity.html'
          } else {
            this.errorMessage = '请输入账号和密码'
          }
        }
      }
    }).mount('#app')
  </script>
</body>

</html>
