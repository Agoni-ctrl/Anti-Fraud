<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - DeepReal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0071E3',
            secondary: '#0F172A',
            light: '#F5F5F7',
            blue: '#0071E3'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .main-container {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
    }

    .logo-card {
      background: linear-gradient(135deg, #0071E3 0%, #0056b3 100%);
      border-radius: 16px 0 0 16px;
      box-shadow: none;
      padding: 48px 36px;
      position: relative;
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 420px;
    }

    @media (max-width: 768px) {
      .logo-card {
        border-radius: 16px 16px 0 0;
        padding: 36px 30px;
      }
    }

    .logo-icon {
      font-size: 96px;
      margin-bottom: 18px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .logo-title {
      font-size: 54px;
      font-weight: 800;
      color: white;
      letter-spacing: 3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      margin-bottom: 9px;
    }

    .logo-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1.5px;
    }

    .logo-decoration {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .register-card {
      background: white;
      border-radius: 0 16px 16px 0;
      box-shadow: none;
      flex: 1.5;
      padding: 48px 48px;
      min-width: 480px;
    }

    @media (max-width: 768px) {
      .register-card {
        border-radius: 0 0 16px 16px;
        padding: 36px 36px;
      }
    }

    .input-field {
      border: 2px solid #0071E3;
      border-radius: 8px;
      color: #000000;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #0071E3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
      outline: none;
    }

    .btn-primary {
      background-color: #0071E3;
      color: white;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 2px solid #0071E3;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    .btn-disabled {
      background-color: #e5e7eb;
      color: #9ca3af;
      border: 2px solid #d1d5db;
      cursor: not-allowed;
    }

    .btn-secondary {
      border: 2px solid #0071E3;
      color: #0071E3;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(0, 113, 227, 0.1);
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.3s ease;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen flex items-center justify-center p-4">
  <div id="app">
    <div class="main-container w-full max-w-4xl">
      <!-- Logo卡片 -->
      <div class="logo-card">
        <div class="logo-icon">🛡️</div>
        <h1 class="logo-title">DeepReal</h1>
        <p class="logo-subtitle">智能反诈 · 守护真实</p>
        <div class="logo-decoration"></div>
      </div>

      <!-- 注册卡片 -->
      <div class="register-card">
        <div class="text-center mb-4">
          <h2 class="text-xl font-bold text-black mb-1">用户注册</h2>
        </div>

        <form @submit.prevent="handleRegister">
          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">手机号/邮箱</label>
            <input v-model="formData.account" type="text" placeholder="请输入手机号或邮箱" class="input-field w-full px-3 py-2"
              required @input="checkAccountFormat">
            <p v-if="accountFormatError" class="text-xs text-red-500 mt-1">{{ accountFormatError }}</p>
          </div>

          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">验证码</label>
            <div class="flex gap-3">
              <input v-model="formData.verifyCode" type="text" placeholder="请输入验证码" class="input-field flex-1 px-3 py-2"
                required>
              <button type="button" @click="sendVerifyCode"
                :disabled="isSending || countdown > 0 || !isAccountFormatValid"
                :class="['px-4 py-2 text-sm font-medium rounded-lg transition-all', !isAccountFormatValid ? 'btn-disabled' : (isSending || countdown > 0) ? 'btn-disabled' : 'btn-primary']">
                {{ hasSentCode ? (countdown > 0 ? `${countdown}秒后重发` : '重新获取') : '获取验证码' }}
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">设置密码</label>
            <input v-model="formData.password" type="password" placeholder="请设置密码" class="input-field w-full px-3 py-2"
              required>
          </div>

          <div class="mb-4">
            <label class="block text-black font-medium mb-1 text-sm">确认密码</label>
            <input v-model="formData.confirmPassword" type="password" placeholder="请再次输入密码"
              class="input-field w-full px-3 py-2" required>
          </div>

          <div class="mb-4">
            <label class="flex items-center">
              <input v-model="formData.agreeTerms" type="checkbox" class="mr-2" required>
              <span class="text-black text-xs">我已阅读并同意《用户协议》和《隐私政策》</span>
            </label>
          </div>

          <button type="submit" class="btn-primary w-full py-2.5 text-base font-medium">
            注册
          </button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-sm text-black">
            已有账号？
            <a href="login.html" class="text-blue-600 hover:underline">立即登录</a>
          </p>
        </div>

        <transition name="fade">
          <div v-if="successMessage"
            class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-600 text-center">
            {{ successMessage }}
          </div>
        </transition>

        <transition name="fade">
          <div v-if="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-center">
            {{ errorMessage }}
          </div>
        </transition>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue

    createApp({
      data() {
        return {
          formData: {
            accountType: 'phone',
            account: '',
            verifyCode: '',
            password: '',
            confirmPassword: '',
            agreeTerms: false
          },
          isSending: false,
          countdown: 0,
          timer: null,
          successMessage: '',
          errorMessage: '',
          accountFormatError: '',
          hasSentCode: false
        }
      },
      computed: {
        isAccountFormatValid() {
          const phoneReg = /^1[3-9]\d{9}$/
          const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
          return phoneReg.test(this.formData.account) || emailReg.test(this.formData.account)
        }
      },
      methods: {
        checkAccountFormat() {
          const phoneReg = /^1[3-9]\d{9}$/
          const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

          if (!this.formData.account) {
            this.accountFormatError = ''
            return
          }

          if (!phoneReg.test(this.formData.account) && !emailReg.test(this.formData.account)) {
            this.accountFormatError = '请输入正确的手机号或邮箱格式'
          } else {
            this.accountFormatError = ''
          }
        },
        sendVerifyCode() {
          if (this.isSending || this.countdown > 0 || !this.isAccountFormatValid) {
            return
          }

          if (!this.formData.account) {
            this.errorMessage = '请输入手机号或邮箱'
            return
          }

          this.isSending = true
          this.errorMessage = ''

          setTimeout(() => {
            this.isSending = false
            this.hasSentCode = true
            this.startCountdown()
            alert('验证码已发送，请注意查收')
          }, 1000)
        },
        startCountdown() {
          this.countdown = 60
          this.timer = setInterval(() => {
            this.countdown--
            if (this.countdown <= 0) {
              clearInterval(this.timer)
              this.timer = null
            }
          }, 1000)
        },
        handleRegister() {
          this.errorMessage = ''
          this.successMessage = ''

          if (!this.formData.account) {
            this.errorMessage = '请输入手机号或邮箱'
            return
          }

          if (!this.formData.verifyCode) {
            this.errorMessage = '请输入验证码'
            return
          }

          if (!this.formData.password) {
            this.errorMessage = '请设置密码'
            return
          }

          if (this.formData.password.length < 6) {
            this.errorMessage = '密码长度不能少于6位'
            return
          }

          if (this.formData.password !== this.formData.confirmPassword) {
            this.errorMessage = '两次输入的密码不一致'
            return
          }

          if (!this.formData.agreeTerms) {
            this.errorMessage = '请同意用户协议和隐私政策'
            return
          }

          this.successMessage = '注册成功！正在跳转到登录页面...'

          setTimeout(() => {
            window.location.href = 'login.html'
          }, 2000)
        }
      },
      beforeUnmount() {
        if (this.timer) {
          clearInterval(this.timer)
        }
      }
    }).mount('#app')
  </script>
</body>

</html>
